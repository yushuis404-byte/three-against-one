<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three Against One - 模块化开发路线图</title>
<style>
:root {
  --bg: #171717;
  --surface: #242424;
  --panel: #2f3133;
  --card: #f4f0e8;
  --card-ink: #1f2428;
  --border: #56514a;
  --text: #f0eee8;
  --muted: #b8b0a6;
  --accent: #e05d3f;
  --done: #44b678;
  --current: #e2b84c;
  --pending: #77716a;
  --track-t: #4aa0a8;
  --track-m: #8e72c7;
  --track-s: #d36d4c;
  --track-g: #71a34d;
  --track-u: #c28b42;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
}
.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 12px 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.brand {
  min-width: 230px;
}
.brand h1 {
  font-size: 17px;
  line-height: 1.2;
}
.brand p {
  margin-top: 2px;
  color: var(--muted);
  font-size: 12px;
}
.progress {
  flex: 1;
  color: var(--muted);
  font-size: 13px;
}
.progress strong { color: var(--text); }
.toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
}
select, button {
  background: #1f2020;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 6px 10px;
  font-size: 13px;
}
button { cursor: pointer; }
button:hover, select:hover { border-color: var(--accent); }
.stats {
  display: flex;
  gap: 10px;
  font-size: 12px;
  color: var(--muted);
}
.stats .done { color: var(--done); }
.stats .current { color: var(--current); }

.summary {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  padding: 14px 20px 0;
}
.summary-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
}
.summary-card .label {
  color: var(--muted);
  font-size: 11px;
}
.summary-card .value {
  margin-top: 3px;
  font-size: 14px;
  font-weight: 700;
}

.phase-container {
  display: grid;
  grid-template-columns: repeat(6, minmax(220px, 1fr));
  gap: 12px;
  padding: 14px 20px 36px;
}
.phase {
  min-height: 620px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}
.phase-header {
  padding: 11px 12px;
  border-bottom: 1px solid var(--border);
}
.phase-header h2 {
  font-size: 14px;
}
.phase-header .goal {
  margin-top: 3px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.35;
}
.bar {
  height: 4px;
  background: #151515;
}
.bar .fill {
  height: 100%;
  background: var(--done);
  transition: width .2s;
}
.phase-body {
  padding: 9px;
}
.track-group {
  margin-bottom: 10px;
}
.track-label {
  display: inline-block;
  margin-bottom: 5px;
  padding: 3px 7px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 700;
}
.track-label.t { color: var(--track-t); background: color-mix(in srgb, var(--track-t) 20%, transparent); }
.track-label.m { color: var(--track-m); background: color-mix(in srgb, var(--track-m) 20%, transparent); }
.track-label.s { color: var(--track-s); background: color-mix(in srgb, var(--track-s) 20%, transparent); }
.track-label.g { color: var(--track-g); background: color-mix(in srgb, var(--track-g) 20%, transparent); }
.track-label.u { color: var(--track-u); background: color-mix(in srgb, var(--track-u) 20%, transparent); }

.card {
  margin-bottom: 6px;
  padding: 8px 9px;
  background: var(--card);
  color: var(--card-ink);
  border: 2px solid transparent;
  border-radius: 6px;
  cursor: pointer;
}
.card:hover { border-color: var(--accent); }
.card.selected {
  border-color: var(--current);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--current) 24%, transparent);
}
.card .top {
  display: grid;
  grid-template-columns: 22px 46px 1fr;
  gap: 5px;
  align-items: start;
}
.status-icon {
  width: 18px;
  font-size: 12px;
  text-align: center;
}
.status-icon.done { color: var(--done); }
.status-icon.current { color: #a97800; }
.status-icon.pending { color: var(--pending); }
.id {
  color: #6d665e;
  font-size: 11px;
  font-weight: 800;
}
.name {
  font-size: 13px;
  font-weight: 700;
  line-height: 1.25;
}
.desc {
  margin-top: 5px;
  color: #4e4a45;
  font-size: 11px;
  line-height: 1.35;
}
.meta {
  margin-top: 5px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  color: #6d665e;
  font-size: 10px;
}
.pill {
  padding: 2px 5px;
  border: 1px solid #c8bda9;
  border-radius: 999px;
}

.notes-toggle {
  position: fixed;
  right: 0;
  top: 48%;
  z-index: 30;
  padding: 10px 7px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-right: 0;
  border-radius: 6px 0 0 6px;
  writing-mode: vertical-lr;
  cursor: pointer;
  color: var(--muted);
}
.notes-panel {
  position: fixed;
  right: -360px;
  top: 0;
  z-index: 40;
  display: flex;
  flex-direction: column;
  width: 340px;
  height: 100vh;
  background: var(--surface);
  border-left: 1px solid var(--border);
  transition: right .2s;
}
.notes-panel.open { right: 0; }
.notes-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 13px 14px;
  border-bottom: 1px solid var(--border);
}
.notes-head h3 { font-size: 14px; }
.module-info {
  padding: 10px 14px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.5;
  border-bottom: 1px solid var(--border);
}
textarea {
  flex: 1;
  resize: none;
  border: 0;
  outline: 0;
  padding: 12px 14px;
  background: #191919;
  color: var(--text);
  font: inherit;
  font-size: 13px;
  line-height: 1.6;
}
.notes-foot {
  padding: 8px 14px;
  color: var(--muted);
  font-size: 11px;
  border-top: 1px solid var(--border);
  text-align: right;
}
.context-menu {
  position: fixed;
  z-index: 60;
  min-width: 140px;
  display: none;
  padding: 5px 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
}
.context-menu .item {
  padding: 7px 13px;
  font-size: 13px;
  cursor: pointer;
}
.context-menu .item:hover { background: var(--panel); }
.toast {
  position: fixed;
  left: 50%;
  bottom: 22px;
  transform: translateX(-50%);
  z-index: 90;
  opacity: 0;
  padding: 8px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  transition: opacity .2s;
  pointer-events: none;
}
.toast.show { opacity: 1; }
@media (max-width: 1250px) {
  .phase-container { grid-template-columns: repeat(3, minmax(240px, 1fr)); }
  .summary { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 760px) {
  .topbar { align-items: flex-start; flex-direction: column; }
  .brand { min-width: 0; }
  .toolbar { width: 100%; flex-wrap: wrap; }
  .phase-container { grid-template-columns: 1fr; }
  .summary { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <h1>Three Against One</h1>
    <p>模板化重构路线图</p>
  </div>
  <div class="progress">当前焦点：<strong id="currentLabel">-</strong></div>
  <div class="toolbar">
    <select id="jumpSelect" onchange="jumpToModule(this.value)">
      <option value="">选择模块</option>
    </select>
    <button id="btnSave" onclick="saveState()">保存</button>
  </div>
  <div class="stats">
    <span class="done" id="statDone">Done 0</span>
    <span class="current" id="statCurrent">Current 0</span>
    <span id="statPending">Pending 0</span>
  </div>
</div>

<section class="summary">
  <div class="summary-card"><div class="label">开发策略</div><div class="value">先工具包，后内容扩张</div></div>
  <div class="summary-card"><div class="label">当前阶段</div><div class="value">R2 单位模板迁移</div></div>
  <div class="summary-card"><div class="label">近期目标</div><div class="value">新增兵种不改核心脚本</div></div>
  <div class="summary-card"><div class="label">长期目标</div><div class="value">UI / AI / 多人共用 Action</div></div>
</section>

<main class="phase-container" id="phaseContainer"></main>

<div class="notes-toggle" onclick="toggleNotes()">笔记</div>
<aside class="notes-panel" id="notesPanel">
  <div class="notes-head">
    <h3 id="notesTitle">笔记</h3>
    <button onclick="toggleNotes()">关闭</button>
  </div>
  <div class="module-info" id="notesModuleInfo">选择一个模块开始记录。</div>
  <textarea id="notesText" placeholder="记录设计决策、阻塞点、验收标准、后续想法。"></textarea>
  <div class="notes-foot" id="notesSaved">-</div>
</aside>

<div class="context-menu" id="contextMenu">
  <div class="item" onclick="setCardStatus('pending')">○ 待开发</div>
  <div class="item" onclick="setCardStatus('current')">● 进行中</div>
  <div class="item" onclick="setCardStatus('done')">✓ 已完成</div>
</div>
<div class="toast" id="toast"></div>

<script>
const MODULES = [
  { id:"P0", name:"原型冻结与架构盘点", phase:1, track:"S", trackName:"策略", hours:"0.5d", deps:[], status:"done", desc:"把当前 v0.3 原型作为行为参考版，停止继续硬编码堆功能。" },
  { id:"P1", name:"模板工具包底座", phase:1, track:"T", trackName:"模板", hours:"1d", deps:["P0"], status:"done", desc:"建立 GameTemplate、UnitTemplate、BuildingTemplate、ProductionRecipe、TemplateRegistry。" },
  { id:"P2", name:"模板文档与示例", phase:1, track:"T", trackName:"模板", hours:"0.5d", deps:["P1"], status:"done", desc:"说明如何用模板派生兵种、建筑和生产链。" },

  { id:"U1", name:"初始单位改读模板", phase:2, track:"M", trackName:"迁移", hours:"1d", deps:["P1"], status:"current", desc:"UnitManager 初始工人、斥候、守卫从 TemplateRegistry 创建。" },
  { id:"U2", name:"兵种实例模型", phase:2, track:"T", trackName:"模板", hours:"1-2d", deps:["U1"], status:"pending", desc:"单位实例只保存 template_id、hp、位置、状态，属性全部来自模板。" },
  { id:"U3", name:"招募流程模板化", phase:2, track:"G", trackName:"玩法", hours:"1-2d", deps:["U1"], status:"pending", desc:"招募营和兵营读取 recruit_options，不再写死工人招募。" },
  { id:"U4", name:"阵营兵种变体", phase:2, track:"T", trackName:"模板", hours:"1d", deps:["U2"], status:"pending", desc:"同一兵种模板派生精灵/矮人/兽人轻微差异。" },

  { id:"B1R", name:"建筑模板迁移", phase:3, track:"M", trackName:"迁移", hours:"2-3d", deps:["P1"], status:"pending", desc:"BuildingData 静态工厂逐步迁移到 BuildingTemplate。" },
  { id:"B2R", name:"放置规则组件化", phase:3, track:"T", trackName:"模板", hours:"2d", deps:["B1R"], status:"pending", desc:"领地、地形、资源点、footprint、数量限制拆成可复用规则。" },
  { id:"B3R", name:"建筑 UI 改读模板", phase:3, track:"U", trackName:"界面", hours:"1-2d", deps:["B1R"], status:"pending", desc:"建筑卡片、成本、产出、说明从模板生成。" },
  { id:"B4R", name:"特殊建筑去 if 化", phase:3, track:"G", trackName:"玩法", hours:"2d", deps:["B2R"], status:"pending", desc:"金矿矿井、金币铸造厂、招募营使用模板字段和配方表达特殊性。" },

  { id:"E1R", name:"资源定义模板化", phase:4, track:"M", trackName:"迁移", hours:"1-2d", deps:["P1"], status:"pending", desc:"地图资源点从 ResourceManager 硬编码表迁移到 ResourceNodeTemplate。" },
  { id:"E2R", name:"生产配方统一", phase:4, track:"T", trackName:"模板", hours:"2d", deps:["B1R","E1R"], status:"pending", desc:"建筑产出、驻军产出、资源转换、采集奖励都走 ProductionRecipe。" },
  { id:"E3R", name:"经济系统单一入口", phase:4, track:"S", trackName:"策略", hours:"2d", deps:["E2R"], status:"pending", desc:"ResourceTracker 只负责库存，生产结算交给 EconomySystem。" },
  { id:"E4R", name:"金币链验收", phase:4, track:"G", trackName:"玩法", hours:"1d", deps:["E2R"], status:"pending", desc:"金矿点 -> 矿井驻工 -> gold_ore -> 铸币厂 -> gold 全链路稳定。" },

  { id:"A1R", name:"Action 基类", phase:5, track:"S", trackName:"策略", hours:"1-2d", deps:["U2","B2R","E3R"], status:"pending", desc:"所有玩家操作都有 can_execute、execute、cost、error_message。" },
  { id:"A2R", name:"建造/移动/招募 Action", phase:5, track:"G", trackName:"玩法", hours:"2-3d", deps:["A1R"], status:"pending", desc:"UI 和键鼠操作先改走 Action。" },
  { id:"A3R", name:"攻击/驻军/采集 Action", phase:5, track:"G", trackName:"玩法", hours:"2-3d", deps:["A1R"], status:"pending", desc:"战斗、驻军、采集也统一为可验证动作。" },
  { id:"A4R", name:"EventBus 与日志", phase:5, track:"S", trackName:"策略", hours:"1-2d", deps:["A2R"], status:"pending", desc:"Action 结果发事件，UI、音效、AI、网络不直接耦合 Manager。" },

  { id:"C4R", name:"科技树", phase:6, track:"G", trackName:"玩法", hours:"4-5d", deps:["A4R"], status:"pending", desc:"科技解锁模板、建筑、兵种、配方，而不是直接改系统代码。" },
  { id:"D1R", name:"攻城与掠夺", phase:6, track:"G", trackName:"玩法", hours:"4-5d", deps:["A3R"], status:"pending", desc:"建筑受击、耐久、掠夺收益、修复冷却。" },
  { id:"D4R", name:"中立生物与巨龙", phase:6, track:"G", trackName:"玩法", hours:"4-6d", deps:["C4R","D1R"], status:"pending", desc:"中立单位、巨龙事件、巢穴互动都作为模板和 Action 扩展。" },
  { id:"E5R", name:"HUD 与操作面板重构", phase:6, track:"U", trackName:"界面", hours:"5-7d", deps:["A4R"], status:"pending", desc:"界面只读模板、状态和 Action，不承载规则。" },
  { id:"AI1", name:"Bot AI", phase:6, track:"S", trackName:"策略", hours:"5-7d", deps:["A4R","C4R"], status:"pending", desc:"AI 只选择 Action，不绕过玩家规则。" },
  { id:"N1", name:"多人网络准备", phase:6, track:"S", trackName:"策略", hours:"待定", deps:["A4R"], status:"pending", desc:"同步 Action 和状态摘要，为远程回合制打基础。" },
];

const TRACK_ORDER = ["T","M","S","G","U"];
const TRACK_LABELS = { T:"模板", M:"迁移", S:"架构", G:"玩法", U:"界面" };
const TRACK_CLASSES = { T:"t", M:"m", S:"s", G:"g", U:"u" };
const PHASE_NAMES = [
  "R1 底层模板工具包",
  "R2 单位模板迁移",
  "R3 建筑系统模板化",
  "R4 资源与生产链",
  "R5 Action 与事件",
  "R6 内容扩展"
];
const PHASE_GOALS = [
  "先搭可复用底座，保持现有原型可运行。",
  "让新增兵种成为填模板，而不是改 UnitManager。",
  "让建筑、兵营、金矿链从硬编码改为数据规则。",
  "统一资源点、采集、驻军生产和转换配方。",
  "为 AI、多人、回放、日志建立统一操作入口。",
  "在新架构上继续做科技、攻城、巨龙、AI、网络。"
];

let state = { modules: {}, currentId: null };
let selectedId = null;
let dirty = false;

function initState() {
  const next = {};
  for (const m of MODULES) {
    const old = state.modules?.[m.id] || {};
    next[m.id] = {
      status: old.status || m.status || "pending",
      notes: old.notes || "",
    };
  }
  state.modules = next;
  if (!state.currentId || !state.modules[state.currentId]) {
    const current = MODULES.find(m => getStatus(m.id) === "current");
    state.currentId = current ? current.id : MODULES[0].id;
  }
}

function getStatus(id) {
  return state.modules[id]?.status || "pending";
}

function render() {
  const container = document.getElementById("phaseContainer");
  container.innerHTML = "";
  const grouped = {};
  for (const m of MODULES) {
    grouped[m.phase] ??= {};
    grouped[m.phase][m.track] ??= [];
    grouped[m.phase][m.track].push(m);
  }

  for (let phase = 1; phase <= 6; phase++) {
    const phaseModules = MODULES.filter(m => m.phase === phase);
    const done = phaseModules.filter(m => getStatus(m.id) === "done").length;
    const pct = phaseModules.length ? Math.round(done / phaseModules.length * 100) : 0;
    const col = document.createElement("section");
    col.className = "phase";
    col.innerHTML = `
      <div class="phase-header">
        <h2>Phase ${phase}: ${PHASE_NAMES[phase - 1]}</h2>
        <div class="goal">${PHASE_GOALS[phase - 1]}</div>
      </div>
      <div class="bar"><div class="fill" style="width:${pct}%"></div></div>
      <div class="phase-body"></div>
    `;
    const body = col.querySelector(".phase-body");
    for (const track of TRACK_ORDER) {
      const mods = grouped[phase]?.[track];
      if (!mods) continue;
      const group = document.createElement("div");
      group.className = "track-group";
      group.innerHTML = `<div class="track-label ${TRACK_CLASSES[track]}">${TRACK_LABELS[track]}</div>`;
      for (const m of mods) {
        group.appendChild(renderCard(m));
      }
      body.appendChild(group);
    }
    container.appendChild(col);
  }
  updateStats();
  updateJumpSelect();
  updateCurrentLabel();
  updateNotesPanel();
}

function renderCard(m) {
  const status = getStatus(m.id);
  const icon = status === "done" ? "✓" : status === "current" ? "●" : "○";
  const card = document.createElement("article");
  card.className = `card${selectedId === m.id ? " selected" : ""}`;
  card.dataset.id = m.id;
  card.innerHTML = `
    <div class="top">
      <span class="status-icon ${status}">${icon}</span>
      <span class="id">${m.id}</span>
      <span class="name">${m.name}</span>
    </div>
    <div class="desc">${m.desc}</div>
    <div class="meta">
      <span class="pill">${m.hours}</span>
      ${m.deps.length ? `<span class="pill">依赖 ${m.deps.join(", ")}</span>` : ""}
    </div>
  `;
  card.addEventListener("click", () => selectCard(m.id));
  card.addEventListener("contextmenu", (event) => {
    event.preventDefault();
    showContextMenu(event, m.id);
  });
  return card;
}

function selectCard(id) {
  selectedId = id;
  state.currentId = id;
  dirty = true;
  render();
  if (!document.getElementById("notesPanel").classList.contains("open")) {
    toggleNotes();
  }
}

function setCardStatus(status) {
  if (!selectedId) return;
  state.modules[selectedId].status = status;
  dirty = true;
  hideContextMenu();
  render();
}

function showContextMenu(event, id) {
  selectedId = id;
  const menu = document.getElementById("contextMenu");
  menu.style.display = "block";
  menu.style.left = Math.min(event.clientX, window.innerWidth - 155) + "px";
  menu.style.top = Math.min(event.clientY, window.innerHeight - 120) + "px";
  render();
}

function hideContextMenu() {
  document.getElementById("contextMenu").style.display = "none";
}

document.addEventListener("click", (event) => {
  if (!event.target.closest(".context-menu")) hideContextMenu();
});

function toggleNotes() {
  document.getElementById("notesPanel").classList.toggle("open");
  updateNotesPanel();
}

function updateNotesPanel() {
  if (!selectedId) selectedId = state.currentId;
  const m = MODULES.find(item => item.id === selectedId);
  if (!m) return;
  document.getElementById("notesTitle").textContent = `${m.id} ${m.name}`;
  document.getElementById("notesModuleInfo").textContent =
    `Phase ${m.phase} / ${m.trackName} / ${m.hours}` + (m.deps.length ? ` / 依赖：${m.deps.join(", ")}` : "");
  document.getElementById("notesText").value = state.modules[m.id]?.notes || "";
}

function saveNotes() {
  if (!selectedId) return;
  state.modules[selectedId].notes = document.getElementById("notesText").value;
  dirty = true;
  document.getElementById("notesSaved").textContent = "已暂存 " + new Date().toLocaleTimeString();
}

let notesTimer = null;
document.getElementById("notesText").addEventListener("input", () => {
  clearTimeout(notesTimer);
  document.getElementById("notesSaved").textContent = "编辑中...";
  notesTimer = setTimeout(saveNotes, 400);
});

function updateStats() {
  let done = 0;
  let current = 0;
  let pending = 0;
  for (const m of MODULES) {
    const status = getStatus(m.id);
    if (status === "done") done++;
    else if (status === "current") current++;
    else pending++;
  }
  document.getElementById("statDone").textContent = `Done ${done}`;
  document.getElementById("statCurrent").textContent = `Current ${current}`;
  document.getElementById("statPending").textContent = `Pending ${pending}`;
}

function updateJumpSelect() {
  const select = document.getElementById("jumpSelect");
  const old = select.value;
  select.innerHTML = '<option value="">选择模块</option>';
  for (const m of MODULES) {
    const option = document.createElement("option");
    option.value = m.id;
    option.textContent = `P${m.phase} ${m.id} ${m.name}`;
    select.appendChild(option);
  }
  select.value = old;
}

function updateCurrentLabel() {
  const m = MODULES.find(item => item.id === state.currentId);
  document.getElementById("currentLabel").textContent = m ? `${m.id} ${m.name}` : "-";
}

function jumpToModule(id) {
  if (id) selectCard(id);
}

async function loadState() {
  try {
    const resp = await fetch("/api/state");
    if (resp.ok) state = await resp.json();
  } catch (error) {
    console.warn("无法读取 state.json，使用默认状态。", error);
  }
  initState();
  selectedId = state.currentId;
  render();
}

async function saveState() {
  saveNotes();
  const button = document.getElementById("btnSave");
  button.textContent = "保存中...";
  try {
    const resp = await fetch("/api/state", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(state),
    });
    if (!resp.ok) throw new Error(String(resp.status));
    dirty = false;
    button.textContent = "已保存";
    showToast("路线图已保存");
  } catch (error) {
    button.textContent = "保存失败";
    showToast("无法连接本地路线图服务");
  }
  setTimeout(() => button.textContent = "保存", 1600);
}

function showToast(message) {
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 2200);
}

document.addEventListener("keydown", (event) => {
  if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "s") {
    event.preventDefault();
    saveState();
  }
  if (event.key === "Escape") {
    hideContextMenu();
  }
});

loadState();
setInterval(() => {
  if (dirty) saveState();
}, 30000);
</script>
</body>
</html>
