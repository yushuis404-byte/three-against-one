<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three Against One - 文明路线开发路线图</title>
<style>
:root {
  --bg: #171717;
  --surface: #242424;
  --card: #f4f0e8;
  --ink: #1f2428;
  --border: #56514a;
  --text: #f0eee8;
  --muted: #b8b0a6;
  --accent: #e05d3f;
  --done: #44b678;
  --current: #e2b84c;
  --pending: #77716a;
  --template: #4aa0a8;
  --migration: #8e72c7;
  --architecture: #d36d4c;
  --gameplay: #71a34d;
  --ui: #c28b42;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
}
.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 12px 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.brand { min-width: 260px; }
.brand h1 { font-size: 17px; line-height: 1.2; }
.brand p { margin-top: 2px; color: var(--muted); font-size: 12px; }
.progress { flex: 1; color: var(--muted); font-size: 13px; }
.progress strong { color: var(--text); }
.toolbar { display: flex; gap: 8px; align-items: center; }
select, button {
  background: #1f2020;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 6px 10px;
  font-size: 13px;
}
button { cursor: pointer; }
button:hover, select:hover { border-color: var(--accent); }
.stats { display: flex; gap: 10px; color: var(--muted); font-size: 12px; }
.stats .done { color: var(--done); }
.stats .current { color: var(--current); }
.summary {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  padding: 14px 20px 0;
}
.summary-card {
  padding: 10px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
}
.summary-card .label { color: var(--muted); font-size: 11px; }
.summary-card .value { margin-top: 3px; font-size: 14px; font-weight: 700; line-height: 1.35; }
.phase-container {
  display: grid;
  grid-template-columns: repeat(6, minmax(220px, 1fr));
  gap: 12px;
  padding: 14px 20px 36px;
}
.phase {
  min-height: 620px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}
.phase-header { padding: 11px 12px; border-bottom: 1px solid var(--border); }
.phase-header h2 { font-size: 14px; }
.phase-header .goal { margin-top: 3px; color: var(--muted); font-size: 11px; line-height: 1.35; }
.bar { height: 4px; background: #151515; }
.bar .fill { height: 100%; background: var(--done); transition: width .2s; }
.phase-body { padding: 9px; }
.track-group { margin-bottom: 10px; }
.track-label {
  display: inline-block;
  margin-bottom: 5px;
  padding: 3px 7px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 700;
}
.track-label.t { color: var(--template); background: color-mix(in srgb, var(--template) 20%, transparent); }
.track-label.m { color: var(--migration); background: color-mix(in srgb, var(--migration) 20%, transparent); }
.track-label.s { color: var(--architecture); background: color-mix(in srgb, var(--architecture) 20%, transparent); }
.track-label.g { color: var(--gameplay); background: color-mix(in srgb, var(--gameplay) 20%, transparent); }
.track-label.u { color: var(--ui); background: color-mix(in srgb, var(--ui) 20%, transparent); }
.card {
  margin-bottom: 6px;
  padding: 8px 9px;
  background: var(--card);
  color: var(--ink);
  border: 2px solid transparent;
  border-radius: 6px;
  cursor: pointer;
}
.card:hover { border-color: var(--accent); }
.card.selected {
  border-color: var(--current);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--current) 24%, transparent);
}
.card .top {
  display: grid;
  grid-template-columns: 22px 50px 1fr;
  gap: 5px;
  align-items: start;
}
.status-icon { width: 18px; font-size: 12px; text-align: center; }
.status-icon.done { color: var(--done); }
.status-icon.current { color: #a97800; }
.status-icon.pending { color: var(--pending); }
.id { color: #6d665e; font-size: 11px; font-weight: 800; }
.name { font-size: 13px; font-weight: 700; line-height: 1.25; }
.desc { margin-top: 5px; color: #4e4a45; font-size: 11px; line-height: 1.35; }
.meta { margin-top: 5px; display: flex; flex-wrap: wrap; gap: 6px; color: #6d665e; font-size: 10px; }
.pill { padding: 2px 5px; border: 1px solid #c8bda9; border-radius: 999px; }
.notes-toggle {
  position: fixed;
  right: 0;
  top: 48%;
  z-index: 30;
  padding: 10px 7px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-right: 0;
  border-radius: 6px 0 0 6px;
  writing-mode: vertical-lr;
  cursor: pointer;
  color: var(--muted);
}
.notes-panel {
  position: fixed;
  right: -360px;
  top: 0;
  z-index: 40;
  display: flex;
  flex-direction: column;
  width: 340px;
  height: 100vh;
  background: var(--surface);
  border-left: 1px solid var(--border);
  transition: right .2s;
}
.notes-panel.open { right: 0; }
.notes-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 13px 14px;
  border-bottom: 1px solid var(--border);
}
.notes-head h3 { font-size: 14px; }
.module-info { padding: 10px 14px; color: var(--muted); font-size: 12px; line-height: 1.5; border-bottom: 1px solid var(--border); }
textarea {
  flex: 1;
  resize: none;
  border: 0;
  outline: 0;
  padding: 12px 14px;
  background: #191919;
  color: var(--text);
  font: inherit;
  font-size: 13px;
  line-height: 1.6;
}
.notes-foot { padding: 8px 14px; color: var(--muted); font-size: 11px; border-top: 1px solid var(--border); text-align: right; }
.context-menu {
  position: fixed;
  z-index: 60;
  min-width: 140px;
  display: none;
  padding: 5px 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
}
.context-menu .item { padding: 7px 13px; font-size: 13px; cursor: pointer; }
.context-menu .item:hover { background: #2f3133; }
.toast {
  position: fixed;
  left: 50%;
  bottom: 22px;
  transform: translateX(-50%);
  z-index: 90;
  opacity: 0;
  padding: 8px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  transition: opacity .2s;
  pointer-events: none;
}
.toast.show { opacity: 1; }
@media (max-width: 1250px) {
  .phase-container { grid-template-columns: repeat(3, minmax(240px, 1fr)); }
  .summary { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 760px) {
  .topbar { align-items: flex-start; flex-direction: column; }
  .brand { min-width: 0; }
  .toolbar { width: 100%; flex-wrap: wrap; }
  .phase-container { grid-template-columns: 1fr; }
  .summary { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <h1>Three Against One</h1>
    <p>文明路线与领主底座路线图</p>
  </div>
  <div class="progress">当前焦点：<strong id="currentLabel">-</strong></div>
  <div class="toolbar">
    <select id="jumpSelect" onchange="jumpToModule(this.value)">
      <option value="">选择模块</option>
    </select>
    <button id="btnSave" onclick="saveState()">保存</button>
  </div>
  <div class="stats">
    <span class="done" id="statDone">Done 0</span>
    <span class="current" id="statCurrent">Current 0</span>
    <span id="statPending">Pending 0</span>
  </div>
</div>

<section class="summary">
  <div class="summary-card"><div class="label">设计轴心</div><div class="value">信息 / 空间 / 战争</div></div>
  <div class="summary-card"><div class="label">当前策略</div><div class="value">先做领主模板底座，不做完整大系统</div></div>
  <div class="summary-card"><div class="label">近期目标</div><div class="value">让文明路线能解锁单位、建筑、规则修正</div></div>
  <div class="summary-card"><div class="label">验证目标</div><div class="value">精灵看得更深，矮人控得更稳，兽人打得更赚</div></div>
</section>

<main class="phase-container" id="phaseContainer"></main>

<div class="notes-toggle" onclick="toggleNotes()">笔记</div>
<aside class="notes-panel" id="notesPanel">
  <div class="notes-head">
    <h3 id="notesTitle">笔记</h3>
    <button onclick="toggleNotes()">关闭</button>
  </div>
  <div class="module-info" id="notesModuleInfo">选择一个模块开始记录。</div>
  <textarea id="notesText" placeholder="记录设计决策、阻塞点、验收标准、后续想法。"></textarea>
  <div class="notes-foot" id="notesSaved">-</div>
</aside>

<div class="context-menu" id="contextMenu">
  <div class="item" onclick="setCardStatus('pending')">○ 待开发</div>
  <div class="item" onclick="setCardStatus('current')">● 进行中</div>
  <div class="item" onclick="setCardStatus('done')">✓ 已完成</div>
</div>
<div class="toast" id="toast"></div>

<script>
const MODULES = [
  { id:"F0", name:"原型冻结与现状盘点", phase:1, track:"S", trackName:"架构", hours:"0.5d", deps:[], status:"done", desc:"保留当前 v0.3 原型作为可运行参考，不再在旧结构里硬堆大型系统。" },
  { id:"F1", name:"模板工具包底座", phase:1, track:"T", trackName:"模板", hours:"1d", deps:["F0"], status:"done", desc:"TemplateRegistry、UnitTemplate、BuildingTemplate、ResourceNodeTemplate、ProductionRecipe 作为后续内容入口。" },
  { id:"F2", name:"单位/招募/中立单位接入模板", phase:1, track:"M", trackName:"迁移", hours:"2-3d", deps:["F1"], status:"done", desc:"初始单位、招募队列、中立单位优先读取模板，旧 UnitData 仅作为兼容层。" },
  { id:"F3", name:"地图编辑与水岸画笔", phase:1, track:"U", trackName:"工具", hours:"2-4d", deps:["F0"], status:"done", desc:"编辑器可视化地图、地形/水岸画笔、预览、保存、加载、撤回，为后续空间玩法打底。" },

  { id:"L1", name:"文明轴定义", phase:2, track:"S", trackName:"架构", hours:"0.5d", deps:["F1"], status:"current", desc:"把三文明明确为底层交互轴：精灵=信息，矮人=空间，兽人=战争。只定义规则边界，不急着做终局内容。" },
  { id:"L2", name:"LordTemplate 领主模板", phase:2, track:"T", trackName:"模板", hours:"1d", deps:["L1"], status:"pending", desc:"新增领主模板：文明归属、标签、解锁建筑/单位/配方、被动修正、可招募条件。" },
  { id:"L3", name:"PlayerCivilizationState", phase:2, track:"S", trackName:"架构", hours:"1d", deps:["L2"], status:"pending", desc:"每个玩家保存主文明、已招募领主、信息/空间/战争倾向值、解锁列表。" },
  { id:"L4", name:"文明规则服务", phase:2, track:"T", trackName:"模板", hours:"1-2d", deps:["L3"], status:"pending", desc:"统一查询某玩家是否解锁单位、建筑、资源转化、视野修正、建筑修正、战争收益。" },
  { id:"L5", name:"最小领主选择 UI", phase:2, track:"U", trackName:"界面", hours:"1d", deps:["L3"], status:"pending", desc:"先做调试/原型级 UI：查看当前文明路线，选择或添加一个领主，验证数据链路。" },

  { id:"E1", name:"精灵信息原型：视野修正", phase:3, track:"G", trackName:"玩法", hours:"1-2d", deps:["L4"], status:"pending", desc:"精灵领主提供侦察/视野加成，验证模板修正能影响 FogOfWar 与单位视野。" },
  { id:"E2", name:"精灵信息原型：迷雾能力", phase:3, track:"G", trackName:"玩法", hours:"2-3d", deps:["E1"], status:"pending", desc:"实现一个最小技能：驱散迷雾或制造临时迷雾，确认信息控制能形成玩法差异。" },
  { id:"E3", name:"风语古树与灵息", phase:3, track:"T", trackName:"模板", hours:"1-2d", deps:["L4"], status:"pending", desc:"新增精灵特色建筑与资源产出，但只做基础产出和解锁，不做完整科技树。" },
  { id:"E4", name:"精灵路线验收", phase:3, track:"S", trackName:"架构", hours:"0.5d", deps:["E1","E2","E3"], status:"pending", desc:"判断精灵是否真的变成“看得更多、行动更灵活、正面较弱”的路线。" },

  { id:"D1", name:"矮人空间原型：建筑网络", phase:4, track:"G", trackName:"玩法", hours:"2-3d", deps:["L4"], status:"pending", desc:"建筑之间按距离或连通关系提供防御/产出/修复加成，验证空间组织能力。" },
  { id:"D2", name:"城墙与阻挡规则", phase:4, track:"G", trackName:"玩法", hours:"2-4d", deps:["D1"], status:"pending", desc:"新增石墙、城门或哨塔的最小版本，打通占格、阻挡、可攻击、可修复。" },
  { id:"D3", name:"熔炉与工业资源", phase:4, track:"T", trackName:"模板", hours:"1-2d", deps:["L4"], status:"pending", desc:"秘银/精钢先作为模板资源占位，配方链只做一条最小闭环。" },
  { id:"D4", name:"矮人路线验收", phase:4, track:"S", trackName:"架构", hours:"0.5d", deps:["D1","D2","D3"], status:"pending", desc:"判断矮人是否真的变成“控路、筑防、慢扩张但阵地强”的路线。" },

  { id:"O1", name:"兽人战争原型：击杀收益", phase:5, track:"G", trackName:"玩法", hours:"1-2d", deps:["L4"], status:"pending", desc:"兽人领主提供击杀、摧毁、掠夺收益，验证战争经济是否能形成正反馈。" },
  { id:"O2", name:"战团编组基础", phase:5, track:"G", trackName:"玩法", hours:"3-5d", deps:["O1"], status:"pending", desc:"先做 2-3 个单位的临时编组与协同行军，不急着做完整阵型系统。" },
  { id:"O3", name:"血牙巢穴与兽血", phase:5, track:"T", trackName:"模板", hours:"1-2d", deps:["L4"], status:"pending", desc:"新增兽人特色建筑和战争资源，用于战团强化或战斗收益。" },
  { id:"O4", name:"兽人路线验收", phase:5, track:"S", trackName:"架构", hours:"0.5d", deps:["O1","O2","O3"], status:"pending", desc:"判断兽人是否真的变成“主动打架、靠战争滚收益、长期运营偏弱”的路线。" },

  { id:"X1", name:"文明融合规则", phase:6, track:"S", trackName:"架构", hours:"2-3d", deps:["E4","D4","O4"], status:"pending", desc:"允许玩家通过第二领主获得另一文明的部分能力，形成专精与融合的选择。" },
  { id:"X2", name:"终极建筑占位", phase:6, track:"T", trackName:"模板", hours:"2-3d", deps:["X1"], status:"pending", desc:"世界树圣域、群山要塞、战争议会先做模板和解锁条件，不急着实现终局大招。" },
  { id:"X3", name:"Action/EventBus 统一入口", phase:6, track:"S", trackName:"架构", hours:"3-5d", deps:["L4"], status:"pending", desc:"把建造、移动、招募、攻击、技能统一成可验证 Action，为 AI、回放、多人同步做准备。" },
  { id:"X4", name:"HUD 与路线面板重构", phase:6, track:"U", trackName:"界面", hours:"3-5d", deps:["X1"], status:"pending", desc:"展示文明路线、领主、解锁、当前战略倾向，让玩家理解自己正在走什么路线。" },
  { id:"X5", name:"AI 与中立事件扩展", phase:6, track:"G", trackName:"玩法", hours:"待定", deps:["X3"], status:"pending", desc:"AI 只选择 Action；中立单位、商队、巨龙事件也走模板和事件系统。" },
];

const TRACK_ORDER = ["T","M","S","G","U"];
const TRACK_LABELS = { T:"模板", M:"迁移", S:"架构", G:"玩法", U:"界面/工具" };
const TRACK_CLASSES = { T:"t", M:"m", S:"s", G:"g", U:"u" };
const PHASE_NAMES = ["R1 已完成底座", "R2 领主与文明底座", "R3 精灵：信息路线", "R4 矮人：空间路线", "R5 兽人：战争路线", "R6 融合与长期架构"];
const PHASE_GOALS = [
  "保留已完成模板、招募、中立、地图工具成果，作为新策划的基础设施。",
  "只做文明/领主数据层与查询服务，避免提前实现完整大系统。",
  "用最小信息玩法验证精灵路线是否成立。",
  "用建筑网络和城墙验证矮人的空间控制是否成立。",
  "用战争收益和战团原型验证兽人的战争组织是否成立。",
  "在三条路线都能跑通后，再做融合、终局、AI、多人准备。"
];

let state = { modules: {}, currentId: null };
let selectedId = null;
let dirty = false;

function initState() {
  const next = {};
  for (const m of MODULES) {
    const old = state.modules?.[m.id] || {};
    next[m.id] = {
      status: old.status || m.status || "pending",
      notes: old.notes || "",
    };
  }
  state.modules = next;
  if (!state.currentId || !state.modules[state.currentId]) {
    const current = MODULES.find(m => getStatus(m.id) === "current");
    state.currentId = current ? current.id : MODULES[0].id;
  }
}

function getStatus(id) {
  return state.modules[id]?.status || "pending";
}

function render() {
  const container = document.getElementById("phaseContainer");
  container.innerHTML = "";
  const grouped = {};
  for (const m of MODULES) {
    grouped[m.phase] ??= {};
    grouped[m.phase][m.track] ??= [];
    grouped[m.phase][m.track].push(m);
  }
  for (let phase = 1; phase <= 6; phase++) {
    const phaseModules = MODULES.filter(m => m.phase === phase);
    const done = phaseModules.filter(m => getStatus(m.id) === "done").length;
    const pct = phaseModules.length ? Math.round(done / phaseModules.length * 100) : 0;
    const col = document.createElement("section");
    col.className = "phase";
    col.innerHTML = `
      <div class="phase-header">
        <h2>Phase ${phase}: ${PHASE_NAMES[phase - 1]}</h2>
        <div class="goal">${PHASE_GOALS[phase - 1]}</div>
      </div>
      <div class="bar"><div class="fill" style="width:${pct}%"></div></div>
      <div class="phase-body"></div>
    `;
    const body = col.querySelector(".phase-body");
    for (const track of TRACK_ORDER) {
      const mods = grouped[phase]?.[track];
      if (!mods) continue;
      const group = document.createElement("div");
      group.className = "track-group";
      group.innerHTML = `<div class="track-label ${TRACK_CLASSES[track]}">${TRACK_LABELS[track]}</div>`;
      for (const m of mods) group.appendChild(renderCard(m));
      body.appendChild(group);
    }
    container.appendChild(col);
  }
  updateStats();
  updateJumpSelect();
  updateCurrentLabel();
  updateNotesPanel();
}

function renderCard(m) {
  const status = getStatus(m.id);
  const icon = status === "done" ? "✓" : status === "current" ? "●" : "○";
  const card = document.createElement("article");
  card.className = `card${selectedId === m.id ? " selected" : ""}`;
  card.dataset.id = m.id;
  card.innerHTML = `
    <div class="top">
      <span class="status-icon ${status}">${icon}</span>
      <span class="id">${m.id}</span>
      <span class="name">${m.name}</span>
    </div>
    <div class="desc">${m.desc}</div>
    <div class="meta">
      <span class="pill">${m.hours}</span>
      ${m.deps.length ? `<span class="pill">依赖 ${m.deps.join(", ")}</span>` : ""}
    </div>
  `;
  card.addEventListener("click", () => selectCard(m.id));
  card.addEventListener("contextmenu", (event) => {
    event.preventDefault();
    showContextMenu(event, m.id);
  });
  return card;
}

function selectCard(id) {
  selectedId = id;
  state.currentId = id;
  dirty = true;
  render();
  if (!document.getElementById("notesPanel").classList.contains("open")) toggleNotes();
}

function setCardStatus(status) {
  if (!selectedId) return;
  state.modules[selectedId].status = status;
  dirty = true;
  hideContextMenu();
  render();
}

function showContextMenu(event, id) {
  selectedId = id;
  const menu = document.getElementById("contextMenu");
  menu.style.display = "block";
  menu.style.left = Math.min(event.clientX, window.innerWidth - 155) + "px";
  menu.style.top = Math.min(event.clientY, window.innerHeight - 120) + "px";
  render();
}

function hideContextMenu() {
  document.getElementById("contextMenu").style.display = "none";
}

document.addEventListener("click", (event) => {
  if (!event.target.closest(".context-menu")) hideContextMenu();
});

function toggleNotes() {
  document.getElementById("notesPanel").classList.toggle("open");
  updateNotesPanel();
}

function updateNotesPanel() {
  if (!selectedId) selectedId = state.currentId;
  const m = MODULES.find(item => item.id === selectedId);
  if (!m) return;
  document.getElementById("notesTitle").textContent = `${m.id} ${m.name}`;
  document.getElementById("notesModuleInfo").textContent =
    `Phase ${m.phase} / ${m.trackName} / ${m.hours}` + (m.deps.length ? ` / 依赖：${m.deps.join(", ")}` : "");
  document.getElementById("notesText").value = state.modules[m.id]?.notes || "";
}

function saveNotes() {
  if (!selectedId) return;
  state.modules[selectedId].notes = document.getElementById("notesText").value;
  dirty = true;
  document.getElementById("notesSaved").textContent = "已暂存 " + new Date().toLocaleTimeString();
}

let notesTimer = null;
document.getElementById("notesText").addEventListener("input", () => {
  clearTimeout(notesTimer);
  document.getElementById("notesSaved").textContent = "编辑中...";
  notesTimer = setTimeout(saveNotes, 400);
});

function updateStats() {
  let done = 0;
  let current = 0;
  let pending = 0;
  for (const m of MODULES) {
    const status = getStatus(m.id);
    if (status === "done") done++;
    else if (status === "current") current++;
    else pending++;
  }
  document.getElementById("statDone").textContent = `Done ${done}`;
  document.getElementById("statCurrent").textContent = `Current ${current}`;
  document.getElementById("statPending").textContent = `Pending ${pending}`;
}

function updateJumpSelect() {
  const select = document.getElementById("jumpSelect");
  const old = select.value;
  select.innerHTML = '<option value="">选择模块</option>';
  for (const m of MODULES) {
    const option = document.createElement("option");
    option.value = m.id;
    option.textContent = `P${m.phase} ${m.id} ${m.name}`;
    select.appendChild(option);
  }
  select.value = old;
}

function updateCurrentLabel() {
  const m = MODULES.find(item => item.id === state.currentId);
  document.getElementById("currentLabel").textContent = m ? `${m.id} ${m.name}` : "-";
}

function jumpToModule(id) {
  if (id) selectCard(id);
}

async function loadState() {
  try {
    const resp = await fetch("/api/state");
    if (resp.ok) state = await resp.json();
  } catch (error) {
    console.warn("无法读取 state.json，使用默认状态。", error);
  }
  initState();
  selectedId = state.currentId;
  render();
}

async function saveState() {
  saveNotes();
  const button = document.getElementById("btnSave");
  button.textContent = "保存中...";
  try {
    const resp = await fetch("/api/state", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(state),
    });
    if (!resp.ok) throw new Error(String(resp.status));
    dirty = false;
    button.textContent = "已保存";
    showToast("路线图已保存");
  } catch (error) {
    button.textContent = "保存失败";
    showToast("无法连接本地路线图服务");
  }
  setTimeout(() => button.textContent = "保存", 1600);
}

function showToast(message) {
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 2200);
}

document.addEventListener("keydown", (event) => {
  if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "s") {
    event.preventDefault();
    saveState();
  }
  if (event.key === "Escape") hideContextMenu();
});

loadState();
setInterval(() => {
  if (dirty) saveState();
}, 30000);
</script>
